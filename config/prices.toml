# Illustrative prices for fictional models, in US dollars per million tokens.
# They are not any vendor's price list. Write money as strings, never as floats.
# A price applies from `effective_from` until a later record for the same model.

[[model]]
id = "frontier-large"
effective_from = "2026-01-01"
input_per_mtok = "3.00"
output_per_mtok = "15.00"
cached_input_per_mtok = "0.30"

